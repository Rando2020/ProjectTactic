name: Courtyard Web release gate

on:
  pull_request:
    paths:
      - 'demos/isometric-2v2/**'
      - 'tools/**'
      - 'web/**'
      - '.github/workflows/courtyard-web.yml'
      - '.github/workflows/deploy.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  courtyard-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: '4.6.3'
          use-dotnet: false
          include-templates: true
      - name: Test staging and package gates
        run: |
          python -m unittest discover -s tools -p test_courtyard_web.py
          python -m unittest discover -s tools -p test_browser_courtyard_commands.py
          python -m unittest discover -s tools -p test_browser_courtyard_feedback.py
          node --test tools/test_web_package.mjs
      - name: Import and test supported courtyard contracts
        shell: bash
        run: |
          set -o pipefail
          project="$PWD/demos/isometric-2v2"
          mkdir -p build/courtyard-evidence/contracts
          godot --headless --path "$project" --import
          godot --headless --path "$project" --script res://tests/validate_all_scripts.gd
          XDG_DATA_HOME="$(mktemp -d)" godot --headless --path "$project" --script res://prototypes/isometric/SelectionGuiTest.gd
          XDG_DATA_HOME="$(mktemp -d)" godot --headless --path "$project" res://tests/test_action_clash_readability.tscn
          XDG_DATA_HOME="$(mktemp -d)" godot --headless --path "$project" res://tests/test_job_mastery.tscn
          XDG_DATA_HOME="$(mktemp -d)" godot --headless --path "$project" res://tests/test_warder_protection.tscn
          for file in "$project"/prototypes/isometric/*Test.tscn "$project"/prototypes/blooming/*Test.tscn "$project"/tests/blooming/*.tscn "$project"/tests/blooming_hud/*.tscn "$project"/tests/blooming_ground/ContractTest.tscn "$project"/tests/blooming_contact/ContractTest.tscn; do
            # Retired 1v1 route, not the delivered 2v2 courtyard. See release notes.
            [ "$(basename "$file")" = Test.tscn ] && continue
            scene="${file#"$project"/}"
            log="build/courtyard-evidence/contracts/$(echo "$scene" | tr / _)".log
            XDG_DATA_HOME="$(mktemp -d)" timeout 180 godot --headless --path "$project" "res://$scene" 2>&1 | tee "$log"
            if grep -E 'SCRIPT ERROR:|FAIL:' "$log"; then exit 1; fi
          done
      - name: Preserve integrated ground and contact renderer regressions
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/courtyard-evidence/ground build/courtyard-evidence/contact
          XDG_DATA_HOME="$(mktemp -d)" timeout 180 xvfb-run -a godot --audio-driver Dummy --path demos/isometric-2v2 --rendering-method gl_compatibility res://tests/blooming_ground/RenderedGroundTest.tscn -- --capture-dir="$PWD/build/courtyard-evidence/ground" 2>&1 | tee build/courtyard-evidence/ground-renderer.log
          XDG_DATA_HOME="$(mktemp -d)" timeout 180 xvfb-run -a godot --audio-driver Dummy --path demos/isometric-2v2 --rendering-method gl_compatibility res://tests/blooming_contact/RenderedTest.tscn -- --capture-dir="$PWD/build/courtyard-evidence/contact" 2>&1 | tee build/courtyard-evidence/contact-renderer.log
          python - <<'PY'
          import json
          from pathlib import Path
          for path, count in [('ground/render-tests.json', 13), ('contact/contact-render-tests.json', 9)]:
              result = json.loads((Path('build/courtyard-evidence') / path).read_text())
              assert result['checks'] == count and not result['failures'], result
          PY
      - name: Export fresh production and isolated browser QA packages
        run: python tools/export_courtyard_web.py build/courtyard --qa-directory build/courtyard-qa
      - name: Verify and capture detailed status and timeline portraits from the production pack
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/courtyard-evidence/status-portraits
          # The host package stores PCK bytes in ordered parts, not index.pck.
          # Reassemble the identical accepted bytes only for this native render.
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('build/courtyard')
          asset = json.loads((root / 'asset-parts.json').read_text())['index.pck']
          raw = b''.join((root / part).read_bytes() for part in asset['parts'])
          assert len(raw) == asset['size'] and hashlib.sha256(raw).hexdigest() == asset['sha256']
          assert raw[:4] == b'GDPC'
          Path('build/status-render.pck').write_bytes(raw)
          PY
          XDG_DATA_HOME="$(mktemp -d)" timeout 180 xvfb-run -a godot --audio-driver Dummy --main-pack "$PWD/build/status-render.pck" --rendering-method gl_compatibility res://tests/blooming_capture/StatusPortraitCapture.tscn -- --capture-dir="$PWD/build/courtyard-evidence/status-portraits" 2>&1 | tee build/courtyard-evidence/status-portrait-renderer.log
          for image in zane-status-1920 zane-status-1366 zane-status-960 zane-status-mobile-landscape-844 kael-status-1920 kael-status-original-1920 timeline-target-markers-1920; do
            test -s "build/courtyard-evidence/status-portraits/$image.png"
          done
      - name: Install browser driver dependency
        run: python -m pip install websocket-client
      - name: Exercise Web Magic schools, Skills, Back navigation and production boot
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/courtyard-evidence/browser
          browser_pid=''
          server_pid=''
          trap 'if [ -n "$browser_pid" ]; then kill "$browser_pid" 2>/dev/null || true; wait "$browser_pid" 2>/dev/null || true; fi; if [ -n "$server_pid" ]; then kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; fi' EXIT
          python -m http.server 8000 --bind 127.0.0.1 --directory build >build/courtyard-evidence/browser/server.log 2>&1 &
          server_pid=$!
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$browser" --headless --no-sandbox --disable-dev-shm-usage \
            --force-device-scale-factor=1 --window-size=1920,1080 \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 \
            --remote-allow-origins='http://localhost:9222' \
            --user-data-dir="$(mktemp -d /tmp/courtyard-chrome.XXXXXX)" \
            about:blank >build/courtyard-evidence/browser/chrome.log 2>&1 &
          browser_pid=$!
          python tools/browser_courtyard_smoke.py \
            --url http://127.0.0.1:8000/courtyard-qa/index.html \
            --production-url http://127.0.0.1:8000/courtyard/index.html \
            --output build/courtyard-evidence/browser
          for image in courtyard-magic-schools-1920 courtyard-black-magic-1920 courtyard-time-magic-1920 courtyard-haste-review-1920 courtyard-magic-back-complete-1920 courtyard-magic-schools-1366 courtyard-black-magic-1366 courtyard-time-magic-1366 courtyard-haste-review-1366 courtyard-magic-back-complete-1366 courtyard-kael-commands-1366 courtyard-kael-skills-1366 courtyard-defend-review-1366; do
            test -s "build/courtyard-evidence/browser/$image.png"
          done
      - name: Upload accepted production package
        uses: actions/upload-artifact@v4
        with:
          name: courtyard-web
          path: build/courtyard/
          if-no-files-found: error
      - name: Upload validation and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: courtyard-release-evidence
          path: build/courtyard-evidence/
          if-no-files-found: warn
