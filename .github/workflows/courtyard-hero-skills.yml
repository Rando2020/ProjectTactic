name: Courtyard hero skills
on:
  pull_request:
    paths:
      - 'demos/isometric-2v2/**'
      - '.github/workflows/courtyard-hero-skills.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  skills:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: '4.6.3'
          use-dotnet: false
          include-templates: false
      - name: Import and verify actual hero skill mechanics and lifecycle
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/skill-evidence
          godot --headless --path demos/isometric-2v2 --import 2>&1 | tee build/skill-evidence/import.log
          if grep -E 'SCRIPT ERROR:|ERROR:' build/skill-evidence/import.log; then exit 1; fi
          XDG_DATA_HOME="$(mktemp -d)" timeout 120 godot --headless --path demos/isometric-2v2 res://tests/blooming_skills/HeroSkillsTest.tscn 2>&1 | tee build/skill-evidence/native.log
          if grep -E 'SCRIPT ERROR:|FAIL:|ERROR:' build/skill-evidence/native.log; then exit 1; fi
          XDG_DATA_HOME="$(mktemp -d)" timeout 120 godot --headless --path demos/isometric-2v2 res://tests/blooming_skills/HeroKOTest.tscn 2>&1 | tee build/skill-evidence/ko.log
          if grep -E 'SCRIPT ERROR:|FAIL:|ERROR:' build/skill-evidence/ko.log; then exit 1; fi
          XDG_DATA_HOME="$(mktemp -d)" timeout 120 godot --headless --path demos/isometric-2v2 res://tests/blooming_skills/HeroSaveLoadoutTest.tscn 2>&1 | tee build/skill-evidence/save.log
          if grep -E 'SCRIPT ERROR:|FAIL:|ERROR:' build/skill-evidence/save.log; then exit 1; fi
      - name: Verify actual skill audio and casting effects
        shell: bash
        run: |
          set -o pipefail
          XDG_DATA_HOME="$(mktemp -d)" timeout 120 godot --headless --path demos/isometric-2v2 --script res://tests/modular/test_skill_audio.gd 2>&1 | tee build/skill-evidence/skill-audio.log
          XDG_DATA_HOME="$(mktemp -d)" timeout 120 godot --headless --path demos/isometric-2v2 res://tests/modular/test_support_visuals.tscn 2>&1 | tee build/skill-evidence/support-visuals.log
          XDG_DATA_HOME="$(mktemp -d)" timeout 120 godot --headless --path demos/isometric-2v2 res://tests/modular/test_support_runtime.tscn 2>&1 | tee build/skill-evidence/support-runtime.log
          XDG_DATA_HOME="$(mktemp -d)" timeout 120 godot --headless --path demos/isometric-2v2 res://tests/blooming_skills/SkillFeedbackTest.tscn 2>&1 | tee build/skill-evidence/skill-feedback.log
          XDG_DATA_HOME="$(mktemp -d)" timeout 180 xvfb-run -a godot --audio-driver Dummy --path demos/isometric-2v2 --rendering-method gl_compatibility res://tests/blooming_skills/SkillFeedbackTest.tscn -- --capture-dir="$PWD/build/skill-evidence/feedback" 2>&1 | tee build/skill-evidence/skill-feedback-rendered.log
          for id in haste defend; do
            test -s "build/skill-evidence/feedback/$id-casting.png"
            test -s "build/skill-evidence/feedback/$id-support.png"
          done
          for id in mighty_strike delay_strike heavy_slash; do
            test -s "build/skill-evidence/feedback/$id-charge.png"
            test -s "build/skill-evidence/feedback/$id-impact.png"
          done
          for id in thunderstrike void_pulse; do
            test -s "build/skill-evidence/feedback/$id-casting.png"
            test -s "build/skill-evidence/feedback/$id-impact.png"
          done
          if grep -E 'SCRIPT ERROR:|FAIL:|ERROR:' build/skill-evidence/skill-audio.log build/skill-evidence/support-*.log build/skill-evidence/skill-feedback*.log; then exit 1; fi
      - name: Verify nested Magic and Skills commands
        shell: bash
        run: |
          set -o pipefail
          XDG_DATA_HOME="$(mktemp -d)" timeout 120 godot --headless --path demos/isometric-2v2 res://tests/blooming_commands/CommandMenuTest.tscn 2>&1 | tee build/skill-evidence/commands-native.log
          if grep -E 'SCRIPT ERROR:|FAIL:|ERROR:' build/skill-evidence/commands-native.log; then exit 1; fi
          XDG_DATA_HOME="$(mktemp -d)" timeout 180 xvfb-run -a godot --audio-driver Dummy --path demos/isometric-2v2 --rendering-method gl_compatibility res://tests/blooming_commands/CommandMenuTest.tscn -- --capture-dir="$PWD/build/skill-evidence/commands" 2>&1 | tee build/skill-evidence/commands-rendered.log
          if grep -E 'SCRIPT ERROR:|FAIL:|ERROR:' build/skill-evidence/commands-rendered.log; then exit 1; fi
          for image in 01-magic-schools 02-black-magic 03-time-magic 04-skills; do test -s "build/skill-evidence/commands/$image.png"; done
      - name: Verify planted caster motion and interruption cleanup
        shell: bash
        run: |
          set -o pipefail
          XDG_DATA_HOME="$(mktemp -d)" timeout 120 godot --headless --path demos/isometric-2v2 res://tests/blooming_skills/CasterMotionTest.tscn 2>&1 | tee build/skill-evidence/caster-motion.log
          XDG_DATA_HOME="$(mktemp -d)" timeout 180 xvfb-run -a godot --audio-driver Dummy --path demos/isometric-2v2 --rendering-method gl_compatibility res://tests/blooming_skills/CasterMotionTest.tscn -- --capture-dir="$PWD/build/skill-evidence/caster-motion" 2>&1 | tee build/skill-evidence/caster-motion-rendered.log
          if grep -E 'SCRIPT ERROR:|FAIL:|ERROR:' build/skill-evidence/caster-motion*.log; then exit 1; fi
          for ability in fire haste thunderstrike void_pulse defend; do
            for phase in idle anticipation release; do
              test -s "build/skill-evidence/caster-motion/$ability-$phase.png"
            done
          done
      - name: Capture real skill targeting and delay previews
        shell: bash
        run: |
          set -o pipefail
          XDG_DATA_HOME="$(mktemp -d)" timeout 120 xvfb-run -a godot --audio-driver Dummy --path demos/isometric-2v2 --rendering-method gl_compatibility res://tests/blooming_skills/HeroSkillsTest.tscn -- --capture-dir="$PWD/build/skill-evidence" 2>&1 | tee build/skill-evidence/rendered.log
          if grep -E 'SCRIPT ERROR:|FAIL:|ERROR:' build/skill-evidence/rendered.log; then exit 1; fi
          for image in zane-time-magic kael-skills haste-review haste-applied delay_strike-review heavy_slash-review; do test -s "build/skill-evidence/$image.png"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: courtyard-hero-skills-evidence
          path: build/skill-evidence/
          if-no-files-found: error
