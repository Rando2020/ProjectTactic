name: AI Self-Play Baselines

on:
  pull_request:
    branches: [main, feature/ai-producer-loop, feature/ai-battle-telemetry]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-play:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: chickensoft-games/setup-godot@c233594225991af5aec714e52457cc76d6df8fa2 # v2
        with:
          version: 4.6.2
          use-dotnet: false
          include-templates: false
      - name: Static validation
        run: node tools/check_godot_stability.mjs --skip-godot
      - name: Real-battle self-play baselines
        run: python3 tools/check_self_play_baselines.py
      - name: Upload self-play evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-self-play-baselines
          path: .ai-reports/self-play-baselines/
          if-no-files-found: error
