name: AI Game Director

on:
  pull_request:
    branches: [main, feature/ai-producer-loop, feature/ai-battle-telemetry, feature/ai-self-play-baselines, feature/ai-game-director-loop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-next-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: chickensoft-games/setup-godot@c233594225991af5aec714e52457cc76d6df8fa2 # v2
        with:
          version: 4.6.2
          use-dotnet: false
          include-templates: false
      - name: Static validation
        run: node tools/check_godot_stability.mjs --skip-godot
      - name: Generate next gameplay experiment from real evidence
        run: python3 tools/check_ai_game_director.py
      - name: Validate director JSON
        run: |
          python -m json.tool .ai-reports/game-director/next-experiment.json >/dev/null
          python -m json.tool .ai-reports/game-director/director-state.json >/dev/null
      - name: Upload director evidence and self-generated prompt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-game-director
          path: |
            .ai-reports/self-play-baselines/
            .ai-reports/game-director/
          if-no-files-found: error
