name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install
      - run: npm run build

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.6.2"
          use-dotnet: false
          include-templates: true
      - run: |
          godot --headless --path godot --import
          mkdir -p dist/tactics
          godot --headless --path godot --export-release Web ../dist/tactics/index.html
          python tools/prepare_playable_web.py dist/tactics

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
