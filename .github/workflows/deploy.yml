name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.6.3"

jobs:
  courtyard:
    uses: ./.github/workflows/courtyard-web.yml
    permissions:
      contents: read

  build:
    needs: courtyard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hydrate current Godot runtime assets only
        run: |
          git lfs fetch --include='godot/**' --exclude='' origin HEAD
          git lfs checkout 'godot/**'

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test Web package freshness and integrity
        run: |
          node --test tools/test_web_package.mjs
          python -m unittest discover -s tools -p test_prepare_playable_web.py

      - run: npm install
      - run: npm run build

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true
      - name: Validate, export, and check playable Web package
        run: python tools/export_pages_web.py dist/tactics

      - name: Include independently validated courtyard without replacing campaign
        uses: actions/download-artifact@v4
        with:
          name: courtyard-web
          path: dist/courtyard

      - name: Verify courtyard artifact matches this release commit
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          info = json.loads(Path('dist/courtyard/build-info.json').read_text())
          assert info['source_commit'] == os.environ['GITHUB_SHA'], 'Courtyard artifact commit mismatch'
          assert info['scene'] == 'res://prototypes/blooming/BloomingBattle.tscn'
          PY
          node tools/check_web_package.mjs dist/courtyard

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
