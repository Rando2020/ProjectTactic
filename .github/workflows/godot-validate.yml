name: Godot Validate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GODOT_VERSION: "4.6.3"

jobs:
  godot-validate:
    name: Godot headless validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test Web package freshness and integrity
        run: |
          node --test tools/test_web_package.mjs
          python -m unittest discover -s tools -p test_prepare_playable_web.py

      - name: Hydrate current Godot runtime assets only
        run: |
          git lfs fetch --include='godot/**' --exclude='' origin HEAD
          git lfs checkout 'godot/**'

      - name: Validate narrative data contract
        run: python tools/check_recurrence_story.py

      - name: Test fail-closed Pages export gate
        run: python -m unittest discover -s tools -p test_export_pages_web.py

      - name: Install art validation dependency
        run: python -m pip install Pillow websocket-client

      - name: Validate browser QA harness and cleanup contracts
        run: |
          python -m unittest discover -s tools -p test_export_browser_qa.py
          python -m unittest discover -s tools -p test_browser_combat_smoke.py

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Verify Godot version
        run: godot --version

      - name: Import project headlessly
        run: godot --headless --path godot --import

      - name: Parse production GDScript
        run: godot --headless --path godot --script res://tests/validate_all_scripts.gd

      - name: Test Orren Love and Grief arc
        run: godot --headless --path godot --script res://tests/test_orren_arc.gd

      - name: Validate manifest-backed art batch
        run: |
          python tools/validate_first_art_pass.py
          godot --headless --path godot --script res://tests/test_asset_manifest.gd

      - name: Validate responsive battle HUD layout
        run: godot --headless --path godot --script res://tests/test_battle_hud_layout.gd

      - name: Validate gameplay, presentation, input, and readable UI contracts
        run: |
          python -m unittest discover -s tools -p test_check_playable_loop.py
          python tools/check_playable_loop.py

      - name: Export Godot Web build
        run: |
          mkdir -p build/web
          godot --headless --path godot --export-release "Web" ../build/web/index.html

      - name: Validate Web output
        run: test -s build/web/index.html && test -s build/web/index.pck && test -s build/web/index.wasm

      - name: Export isolated direct-battle Web QA build
        run: |
          python tools/export_browser_qa.py \
            --production-pck build/web/index.pck \
            --output build/web-qa/index.html
          git diff --exit-code -- godot/project.godot
          test ! -e godot/tests/browser_qa

      - name: Package playable Web artifact
        run: |
          python tools/prepare_playable_web.py build/web
          node tools/check_web_package.mjs build/web
          python tools/prepare_playable_web.py build/web-qa
          node tools/check_web_package.mjs build/web-qa

      - name: Upload playable Web build
        uses: actions/upload-artifact@v4
        with:
          name: appointed-playable-web
          path: build/web/

      - name: Exercise battle input and capture browser evidence
        run: |
          mkdir -p docs/qa/browser-captures
          python -m http.server 8000 --directory build/web-qa >docs/qa/browser-captures/server.log 2>&1 &
          server_pid=$!
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$browser" --headless --no-sandbox --disable-dev-shm-usage \
            --force-device-scale-factor=1 --window-size=1600,900 \
            --remote-debugging-port=9222 --remote-allow-origins='*' \
            --user-data-dir=/tmp/projecttactic-chrome \
            about:blank >docs/qa/browser-captures/chrome.log 2>&1 &
          browser_pid=$!
          trap 'kill "$browser_pid" "$server_pid" 2>/dev/null || true' EXIT
          python tools/browser_combat_smoke.py --output docs/qa/browser-captures
          test -s docs/qa/browser-captures/ashvale-battle-loaded.png
          test -s docs/qa/browser-captures/ashvale-battle-settled.png
          test -s docs/qa/browser-captures/ashvale-battle-compact-1366x768.png
          test -s docs/qa/browser-captures/legal-movement-completed.png
          test -s docs/qa/browser-captures/report.json

      - name: Upload browser captures and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forgotten-field-browser-captures
          path: docs/qa/browser-captures/
          if-no-files-found: warn
