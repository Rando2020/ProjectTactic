name: Adaptive Enemy Director Validation

on:
  pull_request:
    paths:
      - 'godot/scripts/ai/enemy/**'
      - 'godot/tests/test_adaptive_opponent_model.gd'
      - 'docs/systems/adaptive-enemy-director.md'
      - '.github/workflows/adaptive-enemy-director.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adaptive-enemy-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: chickensoft-games/setup-godot@c233594225991af5aec714e52457cc76d6df8fa2
        with:
          version: '4.6.2'
          use-dotnet: false
      - name: Static validation
        run: node tools/check_godot_stability.mjs --skip-godot
      - name: Import project
        run: godot --headless --path godot --editor --quit
      - name: Adaptive opponent model tests
        run: godot --headless --path godot --script res://tests/test_adaptive_opponent_model.gd
