name: Run persistence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: chickensoft-games/setup-godot@c233594225991af5aec714e52457cc76d6df8fa2 # v2
        with:
          version: 4.6.2
          use-dotnet: false
          include-templates: false
      - name: Static validation
        run: node tools/check_godot_stability.mjs --skip-godot
      - name: Cold-process save regressions
        run: python3 tools/check_run_persistence.py
