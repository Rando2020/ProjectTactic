<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Shadow -->
  <ellipse cx="32" cy="60" rx="16" ry="4" fill="#00000055"/>
  <!-- Great axe handle -->
  <rect x="47" y="14" width="4" height="32" fill="#6a4c1a" rx="1"/>
  <!-- Axe head -->
  <polygon points="44,10 57,14 57,24 44,28" fill="#9090a8"/>
  <polygon points="46,12 55,15 55,23 46,26" fill="#c0c0d8"/>
  <rect x="43" y="18" width="3" height="6" fill="#6a4c1a"/>
  <!-- Tower shield -->
  <rect x="8" y="20" width="13" height="22" fill="#3a4433" rx="3"/>
  <rect x="10" y="22" width="9" height="18" fill="#4a5543" rx="2"/>
  <rect x="13" y="24" width="3" height="14" fill="#5a6553"/>
  <rect x="10" y="30" width="9" height="2" fill="#5a6553"/>
  <circle cx="14" cy="31" r="3" fill="#cc8800"/>
  <!-- Body - heavy plate -->
  <rect x="18" y="24" width="28" height="22" fill="#334455" rx="2"/>
  <rect x="22" y="26" width="20" height="16" fill="#445566" rx="1"/>
  <!-- Armor rivets/details -->
  <rect x="22" y="26" width="20" height="3" fill="#556677"/>
  <rect x="22" y="36" width="20" height="2" fill="#556677"/>
  <circle cx="25" cy="30" r="2" fill="#667788"/>
  <circle cx="32" cy="30" r="2" fill="#667788"/>
  <circle cx="39" cy="30" r="2" fill="#667788"/>
  <!-- Pauldrons (massive) -->
  <rect x="10" y="22" width="11" height="9" fill="#445566" rx="4"/>
  <rect x="43" y="22" width="11" height="9" fill="#445566" rx="4"/>
  <!-- Gorget (neck guard) -->
  <rect x="25" y="20" width="14" height="7" fill="#445566" rx="2"/>
  <!-- Head - full plate helm -->
  <rect x="19" y="5" width="26" height="18" fill="#334455" rx="3"/>
  <rect x="21" y="7" width="22" height="14" fill="#445566" rx="2"/>
  <!-- Crest on top -->
  <rect x="25" y="3" width="14" height="5" fill="#cc8800" rx="2"/>
  <!-- Face plate (closed) -->
  <rect x="21" y="14" width="22" height="7" fill="#2a3444" rx="1"/>
  <!-- Eye slits (orange glow) -->
  <rect x="23" y="16" width="7" height="2" fill="#ff8800"/>
  <rect x="34" y="16" width="7" height="2" fill="#ff8800"/>
  <!-- Chin guard -->
  <rect x="23" y="21" width="18" height="3" fill="#334455"/>
  <!-- Legs (plated) -->
  <rect x="18" y="46" width="12" height="13" fill="#2a3a4a" rx="2"/>
  <rect x="34" y="46" width="12" height="13" fill="#2a3a4a" rx="2"/>
  <!-- Knee guards -->
  <rect x="18" y="46" width="12" height="4" fill="#3a4a5a" rx="1"/>
  <rect x="34" y="46" width="12" height="4" fill="#3a4a5a" rx="1"/>
  <!-- Sabatons -->
  <rect x="16" y="54" width="15" height="6" fill="#1a2a3a" rx="2"/>
  <rect x="33" y="54" width="15" height="6" fill="#1a2a3a" rx="2"/>
</svg>
