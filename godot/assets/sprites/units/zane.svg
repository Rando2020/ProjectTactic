<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Shadow -->
  <ellipse cx="32" cy="60" rx="13" ry="3" fill="#00000040"/>
  <!-- Sword blade -->
  <rect x="47" y="12" width="3" height="26" fill="#d0d0e8" rx="1"/>
  <rect x="44" y="21" width="9" height="3" fill="#8b6914"/>
  <polygon points="47,10 50,10 49,13 48,13" fill="#e8e8f8"/>
  <!-- Shield -->
  <rect x="13" y="24" width="10" height="14" fill="#4466aa" rx="2"/>
  <rect x="15" y="26" width="6" height="10" fill="#5577bb" rx="1"/>
  <circle cx="18" cy="31" r="2" fill="#3355aa"/>
  <!-- Body plate -->
  <rect x="20" y="26" width="24" height="20" fill="#2244cc" rx="2"/>
  <rect x="24" y="28" width="16" height="14" fill="#3355dd" rx="1"/>
  <!-- Chest cross detail -->
  <rect x="31" y="28" width="2" height="14" fill="#4466ee" opacity="0.6"/>
  <rect x="24" y="34" width="16" height="2" fill="#4466ee" opacity="0.6"/>
  <!-- Pauldrons -->
  <rect x="14" y="23" width="9" height="6" fill="#3355cc" rx="3"/>
  <rect x="41" y="23" width="9" height="6" fill="#3355cc" rx="3"/>
  <!-- Neck -->
  <rect x="27" y="21" width="10" height="6" fill="#f0c07a"/>
  <!-- Head -->
  <rect x="22" y="8" width="20" height="15" fill="#f0c07a" rx="3"/>
  <!-- Helmet -->
  <rect x="20" y="6" width="24" height="10" fill="#4466bb" rx="4"/>
  <rect x="22" y="6" width="20" height="6" fill="#5577cc" rx="3"/>
  <!-- Visor -->
  <rect x="23" y="13" width="18" height="3" fill="#1a2240" rx="1"/>
  <!-- Eyes glow -->
  <rect x="25" y="14" width="5" height="2" fill="#88aaff"/>
  <rect x="34" y="14" width="5" height="2" fill="#88aaff"/>
  <!-- Legs -->
  <rect x="20" y="46" width="10" height="12" fill="#1a33a0" rx="2"/>
  <rect x="34" y="46" width="10" height="12" fill="#1a33a0" rx="2"/>
  <!-- Boots -->
  <rect x="18" y="53" width="13" height="7" fill="#4a2e10" rx="2"/>
  <rect x="33" y="53" width="13" height="7" fill="#4a2e10" rx="2"/>
</svg>
